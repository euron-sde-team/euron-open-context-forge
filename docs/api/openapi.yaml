          anyOf:
          - type: integer
            maximum: 10000000.0
            minimum: 1.0
          - type: 'null'
          title: Max Input Tokens
          description: Budget for messages plus documents. Omit to clean only (dedup, tool output)
        reserve_output_tokens:
          type: integer
          maximum: 1000000.0
          minimum: 0.0
          title: Reserve Output Tokens
          description: Room kept free for the model's answer
          default: 0
