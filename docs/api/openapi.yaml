          type: boolean
          title: Preserve System Instructions
          description: System and developer messages are always returned verbatim; with false, exact duplicates
            among them may be removed
          default: true
        pin_messages:
          items:
            type: integer
          type: array
          maxItems: 1000
          title: Pin Messages
          description: Message indexes never rewritten
        must_keep:
          items:
            type: string
          type: array
          maxItems: 200
          title: Must Keep
          description: Strings that must survive verbatim (ids, values, phrases)
        deduplicate:
          type: boolean
          title: Deduplicate
          default: true
        summarize_history:
          type: boolean
          title: Summarize History
          default: true
        reduce_tool_output:
          type: boolean
          title: Reduce Tool Output
          default: true
        rank_documents:
          type: boolean
          title: Rank Documents
          default: true
        drop_irrelevant_documents:
          type: boolean
          title: Drop Irrelevant Documents
          default: true
        max_documents:
          anyOf:
          - type: integer
            maximum: 10000.0
            minimum: 0.0
          - type: 'null'
          title: Max Documents
        query:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
          title: Query
          description: Ranking query; defaults to the latest user turn
        summary_role:
          type: string
          enum:
          - user
          - assistant
          - system
          title: Summary Role
          description: Role of the generated summary message. user keeps quoted tool and document text
            out of system authority
          default: user
        summarizer:
          type: string
          enum:
          - extractive
          - llm
          title: Summarizer
          default: extractive
        on_budget_failure:
          type: string
          enum:
          - warn
          - error
          title: On Budget Failure
          description: warn returns the best safe result with budget_met=false; error returns 422
          default: warn
        allow_estimate:
