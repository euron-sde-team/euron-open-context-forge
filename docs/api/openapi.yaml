openapi: 3.1.0
info:
  title: Euron Open ContextForge
  description: "\nSelf-hosted context optimization engine. Send the messages, retrieved documents and\
    \ tool\noutput you are about to give an LLM; get back the smallest context that still carries every\n\
    task-critical fact, with real before and after token counts, warnings and a per-stage trace.\n\n*\
    \ `/v1/context/*`: optimize, count tokens, summarize, rank, background jobs. Authenticate\n  with\
    \ a service key (`Authorization: Bearer cfk_...`).\n* `/v1/chat/completions`: OpenAI-compatible proxy\
    \ that optimizes, then forwards upstream\n  (any OpenAI-compatible API, TokenShield or SmartRouter).\n\
    * `/api/v1/*`: the dashboard API (session token from `POST /api/v1/auth/login`).\n"
  version: 0.1.0
paths:
  /v1/context/optimize:
    post:
      tags:
      - context
      summary: Optimize messages and documents to fit a token budget
      operationId: optimize_v1_context_optimize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeRequest'
        required: true
      responses:
        '200':
          description: The optimized context with real before and after counts, warnings and a per-stage
            trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/context/count-tokens:
    post:
      tags:
      - context
      summary: Count tokens with the model's tokenizer (or a marked estimate)
      operationId: count_tokens_v1_context_count_tokens_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountTokensRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountTokensResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/context/summarize:
    post:
      tags:
      - context
      summary: Structured summary of a conversation
      operationId: summarize_v1_context_summarize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummarizeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummarizeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/context/rank:
    post:
      tags:
      - context
      summary: Rank passages by relevance, dropping duplicates and irrelevant ones
      operationId: rank_v1_context_rank_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RankRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/context/jobs:
    post:
      tags:
      - context
      summary: Optimize in the background (large inputs)
      operationId: create_job_v1_context_jobs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/context/jobs/{job_id}:
    get:
      tags:
      - context
      summary: Job status, and the result when done
      operationId: get_job_v1_context_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/chat/completions:
    post:
      tags:
      - proxy
      summary: 'OpenAI-compatible: optimize, then forward upstream'
      operationId: chat_completions_v1_chat_completions_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/models:
    get:
      tags:
      - proxy
      summary: Models of the default upstream (OpenAI-compatible)
      operationId: models_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Sign in to the dashboard
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Sign out
      description: 'Ends this session server-side too: the token is refused until it expires.'
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: The signed-in user
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
  /api/v1/auth/password:
    post:
      tags:
      - auth
      summary: Change your password
      operationId: password_api_v1_auth_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users:
    get:
      tags:
      - users
      summary: List dashboard users
      operationId: list_users_api_v1_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                type: array
                title: Response List Users Api V1 Users Get
    post:
      tags:
      - users
      summary: Invite a dashboard user
      operationId: create_user_api_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{user_id}:
    patch:
      tags:
      - users
      summary: Update a user's name, role or access
      operationId: update_user_api_v1_users__user_id__patch
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/keys:
    get:
      tags:
      - api keys
      summary: List service keys
      operationId: list_keys_api_v1_keys_get
      parameters:
      - name: include_revoked
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Revoked
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyOut'
                title: Response List Keys Api V1 Keys Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - api keys
      summary: Create a key (shown once)
      operationId: create_key_api_v1_keys_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/keys/{key_id}:
    patch:
      tags:
      - api keys
      summary: Update a key's name, limit or defaults
      operationId: update_key_api_v1_keys__key_id__patch
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/keys/{key_id}/revoke:
    post:
      tags:
      - api keys
      summary: Revoke a key immediately
      operationId: revoke_key_api_v1_keys__key_id__revoke_post
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profiles:
    get:
      tags:
      - profiles
      summary: Workload profiles (built-in and custom)
      operationId: list_profiles_api_v1_profiles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProfileOut'
                type: array
                title: Response List Profiles Api V1 Profiles Get
    post:
      tags:
      - profiles
      summary: Create a custom profile
      operationId: create_profile_api_v1_profiles_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/profiles/{name}:
    put:
      tags:
      - profiles
      summary: Edit a profile's weights
      operationId: update_profile_api_v1_profiles__name__put
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - profiles
      summary: Delete a custom profile or reset a built-in one
      operationId: delete_profile_api_v1_profiles__name__delete
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          title: Name
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/upstreams:
    get:
      tags:
      - upstreams
      summary: Upstream LLM endpoints
      operationId: list_upstreams_api_v1_upstreams_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UpstreamOut'
                type: array
                title: Response List Upstreams Api V1 Upstreams Get
    post:
      tags:
      - upstreams
      summary: Add an upstream
      operationId: create_upstream_api_v1_upstreams_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpstreamIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/upstreams/{upstream_id}:
    patch:
      tags:
      - upstreams
      summary: Edit an upstream
      operationId: update_upstream_api_v1_upstreams__upstream_id__patch
      parameters:
      - name: upstream_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Upstream Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpstreamUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - upstreams
      summary: Remove an upstream
      operationId: delete_upstream_api_v1_upstreams__upstream_id__delete
      parameters:
      - name: upstream_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Upstream Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs:
    get:
      tags:
      - runs
      summary: Optimization runs, newest first
      operationId: list_runs_api_v1_runs_get
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(api|proxy|job|playground|benchmark)$
          - type: 'null'
          title: Source
      - name: workload
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(coding|research|support|agent|rag|chat)$
          - type: 'null'
          title: Workload
      - name: budget_missed
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Budget Missed
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_RunOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}:
    get:
      tags:
      - runs
      summary: One run with its trace
      operationId: get_run_api_v1_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: integer
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/content:
    get:
      tags:
      - runs
      summary: Stored input and output (STORE_CONTENT only, admins)
      operationId: run_content_api_v1_runs__run_id__content_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: integer
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Run Content Api V1 Runs  Run Id  Content Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/analytics/overview:
    get:
      tags:
      - runs
      summary: Savings and quality
      operationId: overview_api_v1_analytics_overview_get
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs:
    get:
      tags:
      - jobs
      summary: Recent background jobs
      operationId: list_jobs_api_v1_jobs_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobOut'
                title: Response List Jobs Api V1 Jobs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/benchmarks:
    get:
      tags:
      - benchmarks
      summary: Benchmark runs, newest first
      operationId: list_runs_api_v1_benchmarks_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BenchmarkRunOut'
                title: Response List Runs Api V1 Benchmarks Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - benchmarks
      summary: Run the benchmark (executed by the worker)
      operationId: queue_run_api_v1_benchmarks_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenchmarkRunIn'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkRunOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/benchmarks/dataset:
    get:
      tags:
      - benchmarks
      summary: The committed benchmark cases
      operationId: dataset_api_v1_benchmarks_dataset_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DatasetCase'
                type: array
                title: Response Dataset Api V1 Benchmarks Dataset Get
  /api/v1/benchmarks/{run_id}:
    get:
      tags:
      - benchmarks
      summary: One run with per-case results
      operationId: get_run_api_v1_benchmarks__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkRunDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/benchmarks/{run_id}/report.md:
    get:
      tags:
      - benchmarks
      summary: The run's markdown report
      operationId: report_api_v1_benchmarks__run_id__report_md_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/playground/samples:
    get:
      tags:
      - playground
      summary: Sample inputs to try
      operationId: samples_api_v1_playground_samples_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Sample'
                type: array
                title: Response Samples Api V1 Playground Samples Get
  /api/v1/playground/samples/{sample_id}:
    get:
      tags:
      - playground
      summary: A sample as an optimize request body
      operationId: sample_api_v1_playground_samples__sample_id__get
      parameters:
      - name: sample_id
        in: path
        required: true
        schema:
          type: string
          title: Sample Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Sample Api V1 Playground Samples  Sample Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/playground/optimize:
    post:
      tags:
      - playground
      summary: Optimize from the dashboard
      operationId: optimize_api_v1_playground_optimize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
