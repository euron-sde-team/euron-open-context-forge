<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">ContextForge architecture</title>
  <desc id="d">Applications reach the engine as a Python library, through the REST API, or through the OpenAI-compatible proxy, which forwards optimized requests to an upstream (any OpenAI-compatible API, TokenShield or SmartRouter). The API records runs in Postgres, caches results in optional Redis, keeps job payloads in S3 and seals upstream keys with KMS. A worker runs background jobs and benchmarks. The dashboard reads the admin API.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="560" rx="16" fill="#f7f5f3"/>
  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#0f172a">

    <!-- clients -->
    <text x="40" y="44" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">YOUR APPLICATIONS</text>
    <g filter="url(#s)">
      <rect x="40" y="62" width="210" height="70" rx="12" fill="#fff"/>
      <rect x="40" y="150" width="210" height="70" rx="12" fill="#fff"/>
      <rect x="40" y="238" width="210" height="70" rx="12" fill="#fff"/>
    </g>
    <text x="58" y="92" font-size="15" font-weight="600">Python library</text>
    <text x="58" y="113" font-size="12.5" fill="#64748b">from contextforge import optimize</text>
    <text x="58" y="180" font-size="15" font-weight="600">REST API</text>
    <text x="58" y="201" font-size="12.5" fill="#64748b">/v1/context/optimize, rank, jobs</text>
    <text x="58" y="268" font-size="15" font-weight="600">OpenAI SDK</text>
    <text x="58" y="289" font-size="12.5" fill="#64748b">base_url = ContextForge /v1</text>

    <!-- engine (library path) -->
    <path d="M250 97 H300 V150" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <path d="M250 185 H330" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#o)"/>
    <path d="M250 273 H330" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#o)"/>

    <!-- service -->
    <g filter="url(#s)"><rect x="336" y="140" width="380" height="200" rx="16" fill="#fff"/></g>
    <rect x="336" y="140" width="380" height="6" rx="3" fill="#ea580c"/>
    <text x="358" y="176" font-size="16" font-weight="650">ContextForge API</text>
    <text x="358" y="196" font-size="12.5" fill="#64748b">FastAPI, stateless, N replicas</text>
    <rect x="358" y="212" width="336" height="52" rx="10" fill="#fdeee3"/>
    <text x="374" y="235" font-size="13.5" font-weight="600" fill="#9a3412">Deterministic engine</text>
    <text x="374" y="253" font-size="12" fill="#9a3412">protect, clean, rank, compress, validate (no model)</text>
    <text x="358" y="290" font-size="12.5" fill="#334155">auth and rate limits, result cache, run recording</text>
    <text x="358" y="310" font-size="12.5" fill="#334155">proxy: optimize, then forward (streaming)</text>
    <text x="358" y="330" font-size="12.5" fill="#334155">admin API for the dashboard</text>

    <!-- upstreams -->
    <text x="800" y="44" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">UPSTREAMS (OPTIONAL)</text>
    <g filter="url(#s)">
      <rect x="800" y="62" width="360" height="56" rx="12" fill="#fff"/>
      <rect x="800" y="132" width="360" height="56" rx="12" fill="#fff"/>
      <rect x="800" y="202" width="360" height="56" rx="12" fill="#fff"/>
    </g>
    <text x="818" y="88" font-size="14.5" font-weight="600">TokenShield</text>
    <text x="818" y="106" font-size="12" fill="#64748b">budgets before the call; cost header recorded</text>
    <text x="818" y="158" font-size="14.5" font-weight="600">SmartRouter</text>
    <text x="818" y="176" font-size="12" fill="#64748b">model="auto"; routed model recorded</text>
    <text x="818" y="228" font-size="14.5" font-weight="600">Any OpenAI-compatible API</text>
    <text x="818" y="246" font-size="12" fill="#64748b">OpenAI, Azure, vLLM, Ollama, LM Studio, Groq</text>
    <path d="M716 200 C 760 200, 760 90, 796 90" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#o)"/>
    <path d="M716 215 C 760 215, 760 160, 796 160" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#o)"/>
    <path d="M716 230 H796" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#o)"/>

    <!-- data plane -->
    <text x="40" y="400" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">STATE</text>
    <g filter="url(#s)">
      <rect x="40" y="418" width="250" height="100" rx="12" fill="#fff"/>
      <rect x="310" y="418" width="250" height="100" rx="12" fill="#fff"/>
      <rect x="580" y="418" width="250" height="100" rx="12" fill="#fff"/>
      <rect x="850" y="418" width="310" height="100" rx="12" fill="#fff"/>
    </g>
    <text x="58" y="448" font-size="14.5" font-weight="600">PostgreSQL</text>
    <text x="58" y="469" font-size="12" fill="#64748b">runs (append-only), hourly rollups,</text>
    <text x="58" y="486" font-size="12" fill="#64748b">jobs, profiles, upstreams, keys, audit</text>
    <text x="328" y="448" font-size="14.5" font-weight="600">Redis <tspan font-size="12" font-weight="500" fill="#0e9f6e">optional</tspan></text>
    <text x="328" y="469" font-size="12" fill="#64748b">result cache, rate limits,</text>
    <text x="328" y="486" font-size="12" fill="#64748b">config version (in process without it)</text>
    <text x="598" y="448" font-size="14.5" font-weight="600">S3 and KMS</text>
    <text x="598" y="469" font-size="12" fill="#64748b">job payloads and reports;</text>
    <text x="598" y="486" font-size="12" fill="#64748b">sealed upstream credentials</text>
    <text x="868" y="448" font-size="14.5" font-weight="600">Worker and dashboard</text>
    <text x="868" y="469" font-size="12" fill="#64748b">jobs and benchmarks (SKIP LOCKED leases);</text>
    <text x="868" y="486" font-size="12" fill="#64748b">Next.js reads the admin API</text>
    <path d="M440 340 V412" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M500 340 C 500 380, 435 380, 435 412" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M600 340 C 600 380, 700 380, 700 412" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M380 340 C 380 380, 165 380, 165 412" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M680 340 C 680 370, 1000 370, 1000 412" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="40" y="545" font-size="11.5" fill="#94a3b8">Locally: Docker Compose with S3, KMS and Secrets Manager on Floci, provisioned by the same Terraform. On AWS: ECS Fargate, RDS, ElastiCache, S3, KMS.</text>
  </g>
</svg>
