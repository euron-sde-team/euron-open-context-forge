# ─────────────────────────────────────────────────────────────────────────────
# Euron Open ContextForge: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 4310   api 4330   mock-llm 4350   postgres 4342   redis 4379   floci 4366
# ─────────────────────────────────────────────────────────────────────────────
name: contextforge

x-api-image: &api-image
  build:
    context: ../../apps/api
    dockerfile: ../../infra/docker/api.Dockerfile
  image: contextforge-api:local

x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  ENVIRONMENT: development
  CONTEXTFORGE_CLOUD: local
  LOG_LEVEL: ${CF_LOG_LEVEL:-INFO}
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://contextforge:contextforge@postgres:5432/contextforge
  # Redis is optional for ContextForge. Set CF_REDIS_URL= (empty) in .env to run the
  # whole stack without it: caches and rate limits then run in process.
  REDIS_URL: ${CF_REDIS_URL-redis://redis:6379/0}
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?run `make env` first}
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?run `make env` first}
  KEY_MODE: local
  STORAGE: local
  # Shared by api (job payloads) and worker (job results); the Floci overlay switches to S3.
  LOCAL_STORAGE_DIR: /data/payloads
  COOKIE_SECURE: "false"
  # The dashboard container proxies /api and /v1 with X-Forwarded-For; trust it on the
  # Compose network. On AWS this is the VPC CIDR.
  FORWARDED_ALLOW_IPS: "*"
  CORS_ORIGINS: http://localhost:${CF_WEB_PORT:-4310},http://127.0.0.1:${CF_WEB_PORT:-4310}
  # The demo maps TokenShield-style aliases to real tokenizers.
  TOKENIZER_ALIASES: chat-small=gpt-4o-mini,chat-large=gpt-4o
  # The optional LLM summarizer and the demo upstreams point at the deterministic mock.
  LLM_SUMMARIZER_URL: http://mock-llm:4350/v1
  MOCK_LLM_URL: http://mock-llm:4350
  CONTEXTFORGE_API_URL: http://api:8080
  CF_DEMO_PASSWORD: ${CF_DEMO_PASSWORD:?run `make env` first}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: contextforge
      POSTGRES_USER: contextforge
      POSTGRES_PASSWORD: contextforge
    ports:
      - "127.0.0.1:${CF_PG_PORT:-4342}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextforge -d contextforge"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Result cache, per-key rate limits and the config version stamp. Optional: losing it
  # costs cache hits, never correctness (signed-out sessions live in Postgres).
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${CF_REDIS_PORT:-4379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Deterministic OpenAI-compatible upstream for the demo and the tests. It also answers
  # as a TokenShield-style gateway (/tokenshield/v1) and a SmartRouter-style router
  # (/smartrouter/v1), following their documented header contracts.
  # Call counts and the last request seen: GET http://localhost:4350/stats
  mock-llm:
    <<: *api-image
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["uvicorn", "mockllm.app:app", "--host", "0.0.0.0", "--port", "4350"]
    ports:
      - "127.0.0.1:${CF_MOCK_LLM_PORT:-4350}:4350"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4350/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: apply Alembic migrations before anything that reads the schema starts.
  migrate:
    <<: *api-image
    command: ["migrate"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${CF_API_PORT:-4330}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - payloads:/data/payloads
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *api-image
    command: ["worker"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - payloads:/data/payloads
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    image: contextforge-web:local
    environment:
      # Server-side only: Next rewrites /api/* and /v1/* to the API on the Compose
      # network, so the browser talks to one origin (no CORS, first-party cookies).
      API_INTERNAL_URL: http://api:8080
      PORT: "8080"
    ports:
      - "127.0.0.1:${CF_WEB_PORT:-4310}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  payloads:
